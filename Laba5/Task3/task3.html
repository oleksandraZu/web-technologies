<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №5 — Завдання 3</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <form action="#" method="post">
        <h2>Анкета опитування</h2>

        <fieldset>
            <legend>Особиста інформація</legend>
            
            <label for="fullname">ПІБ:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Іванов Іван Іванович" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>

            <label for="age">Вік:</label>
            <input type="number" id="age" name="age" min="16" max="100">
        </fieldset>

        <fieldset>
            <legend>Переваги та інтереси</legend>

            <label>Ваш рівень володіння веб-технологіями:</label>
            <div class="radio-group">
                <label><input type="radio" name="level" value="beginner" checked> Початківець</label>
                <label><input type="radio" name="level" value="intermediate"> Середній</label>
                <label><input type="radio" name="level" value="advanced"> Професіонал</label>
            </div>

            <label for="city">Місто проживання:</label>
            <select id="city" name="city">
                <option value="chernivtsi">Чернівці</option>
                <option value="kyiv">Київ</option>
                <option value="lviv">Львів</option>
            </select>

            <label for="comments">Коментарі та пропозиції:</label>
            <textarea id="comments" name="comments" rows="4" placeholder="Ваш відгук..."></textarea>
        </fieldset>

        <button type="submit">Надіслати анкету</button>
    </form>

</body>
</html>
